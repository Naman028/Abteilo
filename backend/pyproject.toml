[project]
name = "abteilo"
version = "0.1.0"
description = "Department-aware AI operating layer for companies"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.142.4",
    "starlette==1.7.0",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.41",
    "psycopg[binary]==3.2.9",
    "alembic==1.16.1",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    "argon2-cffi==23.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "anthropic==1.15.0",
    "email-validator==2.2.0",
    "reportlab==5.1.0",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abteilo*"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
